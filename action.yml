name: Install gibo
author: Yui KITSU
description: Install gibo
branding:
  icon: folder-minus
  color: white

inputs:
  version:
    description: |
      gibo release tag to install. Leave empty to use the version pinned
      by the action. The pinned default and its checksum anchors are updated
      together by reviewed commits, not by version-only automation. Override
      to install a different release. Note: when overriding, the checksums
      anchor verification is skipped — the checksums file is trusted
      self-referentially (same release URL). See README.md (Security model)
      for the implications.
    required: false
    default: ''
  update:
    description: |
      Whether to run `gibo update` after installing the binary. Set to
      'false' when the caller restores the boilerplates database from
      `actions/cache` and wants to keep the cached database instead of
      unconditionally pulling upstream changes.
    required: false
    default: 'true'
  boilerplates-ref:
    description: |
      Optional git ref for the boilerplates database. When set, the
      action resolves the ref in the `gibo root` directory and checks
      it out before reporting outputs. With `update: 'true'`, the
      checkout happens after `gibo update`; with `update: 'false'`,
      it uses the database already present on the runner. This makes
      later `gibo dump` output reproducible for the selected database
      commit.
      A full 40-character commit SHA is resolved from the local
      database without a network fetch; the same SHA always points
      to the same object, so `gibo dump` output is stable across
      runs. For fully reproducible output, use a full commit SHA.
      A bare SHA only works when it is already present in the local
      boilerplates database; git servers reject fetches of
      unadvertised objects, so a bare SHA fails when the database is
      empty or was restored from cache without that commit. Use
      `update: 'true'` to populate the database first if needed.
      Branch and tag names (e.g. `main`, `v1.2.3`) are always fetched
      from upstream, so `gibo dump` output tracks the current ref tip
      and may change between runs as the ref advances.
    required: false
    default: ''

outputs:
  version:
    description: gibo release tag that was installed.
    value: ${{ steps.install.outputs.version }}
  bin-dir:
    description: |
      Directory containing the installed gibo executable. Already added
      to GITHUB_PATH; exposed so callers can reference it from
      `actions/cache` keys or other tooling.
    value: ${{ steps.install.outputs.bin-dir }}
  boilerplates-dir:
    description: |
      Directory where gibo stores its boilerplates database (the target
      of `gibo update`, as reported by `gibo root`). Useful as the
      `path` of an `actions/cache` step that caches the database across
      runs.
    value: ${{ steps.install.outputs.boilerplates-dir }}
  boilerplates-commit:
    description: |
      Resolved commit of the boilerplates database when the database is
      present. Empty when the action did not create or restore the
      database.
    value: ${{ steps.install.outputs.boilerplates-commit }}

runs:
  using: composite
  steps:
    - id: install
      run: |
        set -euo pipefail
        tmpdir=$(mktemp -d)
        trap 'rm -rf "${tmpdir}"' EXIT
        cd "${tmpdir}"
        version=v3.0.22
        # Anchor SHA256 of the upstream release's checksums files at the
        # pinned `version` above. Pinning these in this repo's git history
        # moves the trust anchor from "same release URL" to this commit's
        # review trail, defending against upstream tag rewrite, release
        # artifact replacement, and TLS MITM. This pin is intentionally not
        # Renovate-managed: update `version` and both checksum anchors
        # together in the same reviewed commit. See README.md (Security model).
        checksums_txt_sha256=80f59fbfd31eac67bf7a3839909b65b28795594304dac5bae8611db0647c5d67
        checksums_windows_txt_sha256=8f41f9ad8d3f95520f23f2589eae9747f3599c5d682d9a90c2063b617787ee16
        default_version="${version}"
        if [ -n "${INPUT_VERSION}" ]; then
          version="${INPUT_VERSION}"
        fi
        # Guard against path traversal (../) and URL-special characters in version.
        if ! printf '%s' "${version}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          printf 'install-gibo: invalid version format: %s\n' "${version}" >&2
          printf 'install-gibo: version must be a release tag like v3.0.22 (v<major>.<minor>.<patch>)\n' >&2
          exit 1
        fi
        executable=gibo
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            target="gibo_Linux_x86_64.tar.gz"
            checksums="checksums.txt"
            checksums_anchor="${checksums_txt_sha256}"
            ;;
          Linux-ARM64)
            target="gibo_Linux_arm64.tar.gz"
            checksums="checksums.txt"
            checksums_anchor="${checksums_txt_sha256}"
            ;;
          macOS-X64)
            target="gibo_Darwin_x86_64.tar.gz"
            checksums="checksums.txt"
            checksums_anchor="${checksums_txt_sha256}"
            ;;
          macOS-ARM64)
            target="gibo_Darwin_arm64.tar.gz"
            checksums="checksums.txt"
            checksums_anchor="${checksums_txt_sha256}"
            ;;
          Windows-X64)
            target="gibo_Windows_x86_64.zip"
            checksums="checksums.windows.txt"
            checksums_anchor="${checksums_windows_txt_sha256}"
            executable=gibo.exe
            ;;
          Windows-ARM64)
            target="gibo_Windows_arm64.zip"
            checksums="checksums.windows.txt"
            checksums_anchor="${checksums_windows_txt_sha256}"
            executable=gibo.exe
            ;;
          *)
            echo "Unsupported runner platform: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac
        release_url="https://github.com/simonwhitaker/gibo/releases/download/${version}"
        curl -fsSLO --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 "${release_url}/${target}"
        curl -fsSLO --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 "${release_url}/${checksums}"
        if [ "${version}" = "${default_version}" ]; then
          echo "${checksums_anchor}  ${checksums}" | sha256sum --check -
        else
          echo "install-gibo: inputs.version='${version}' differs from the action-pinned default '${default_version}'." >&2
          echo "install-gibo: anchor verification is skipped; the checksums file is trusted self-referentially (same release URL as the archive)." >&2
          echo "install-gibo: see README.md (Security model) for the implications." >&2
        fi
        if ! grep -qF "  ${target}" "${checksums}"; then
          echo "install-gibo: checksum entry for '${target}' not found in '${checksums}'." >&2
          echo "install-gibo: this usually means the checksums file format has changed upstream." >&2
          echo "install-gibo: checksums file contents:" >&2
          cat "${checksums}" >&2
          exit 1
        fi
        grep -F "  ${target}" "${checksums}" > "${target}.sha256"
        sha256sum --check "${target}.sha256"
        case "${target}" in
          *.tar.gz)
            tar -xzf "${target}"
            ;;
          *.zip)
            unzip -q "${target}"
            ;;
          *)
            echo "install-gibo: unsupported archive format: ${target}" >&2
            exit 1
            ;;
        esac
        bin_dir="${RUNNER_TEMP}/gibo/${version}/bin"
        mkdir -p "${bin_dir}"
        trap 'rm -rf "${bin_dir}" "${tmpdir}"' EXIT
        cp "${executable}" "${bin_dir}/${executable}"
        chmod +x "${bin_dir}/${executable}"
        boilerplates_dir="$("${bin_dir}/${executable}" root)"
        created_boilerplates_dir=false
        modified_boilerplates_dir=false
        gibo_update_lock_dir=""
        install_succeeded=false

        cleanup_gibo_update_lock() {
          if [ -n "${gibo_update_lock_dir}" ]; then
            rm -rf "${gibo_update_lock_dir}" 2>/dev/null || true
            gibo_update_lock_dir=""
          fi
        }

        cleanup_partial_install() {
          cleanup_gibo_update_lock
          if [ "${install_succeeded}" != "true" ]; then
            rm -rf "${bin_dir}"
            if [ "${created_boilerplates_dir}" = true ] || [ "${modified_boilerplates_dir}" = true ]; then
              rm -rf "${boilerplates_dir}"
            fi
          fi
        }
        trap 'cleanup_partial_install; rm -rf "${tmpdir}"' EXIT

        acquire_boilerplates_lock() {
          local lock_dir="${boilerplates_dir}.update.lock"
          local lock_wait_seconds=300
          local lock_stale_seconds=600
          local lock_sleep_seconds=2
          local waited_seconds=0
          local owner_pid="" owner_ts=0 now=0

          while ! mkdir "${lock_dir}" 2>/dev/null; do
            # Detect and remove a stale lock left by a process that was
            # killed without running its EXIT trap (e.g. SIGKILL, OOM
            # killer, or runner timeout-minutes enforcement).
            if [ -f "${lock_dir}/pid_ts" ]; then
              read -r owner_pid owner_ts 2>/dev/null < "${lock_dir}/pid_ts" || true
              owner_pid="${owner_pid:-}"
              owner_ts="${owner_ts:-0}"
              now=$(date +%s 2>/dev/null) || now=0
              if { [ -n "${owner_pid}" ] && ! kill -0 "${owner_pid}" 2>/dev/null; } ||
                 { [ "${now}" -gt 0 ] && [ "${owner_ts}" -gt 0 ] &&
                   [ "$(( now - owner_ts ))" -ge "${lock_stale_seconds}" ]; }; then
                echo "install-gibo: removing stale lock (owner: ${owner_pid:-unknown}): ${lock_dir}" >&2
                rm -rf "${lock_dir}" 2>/dev/null || true
                continue
              fi
            fi
            if [ "${waited_seconds}" -ge "${lock_wait_seconds}" ]; then
              echo "install-gibo: timed out waiting for gibo update lock: ${lock_dir}" >&2
              echo "install-gibo: another process may still be updating the shared boilerplates database." >&2
              exit 1
            fi
            if [ "${waited_seconds}" -eq 0 ]; then
              echo "install-gibo: waiting for gibo update lock: ${lock_dir}" >&2
            fi
            sleep "${lock_sleep_seconds}"
            waited_seconds=$((waited_seconds + lock_sleep_seconds))
          done

          printf '%s %s\n' "$$" "$(date +%s)" > "${lock_dir}/pid_ts" 2>/dev/null || true
          gibo_update_lock_dir="${lock_dir}"
        }

        run_gibo_update() {
          if [ ! -e "${boilerplates_dir}" ]; then
            created_boilerplates_dir=true
          fi
          modified_boilerplates_dir=true
          "${bin_dir}/${executable}" update
        }

        case "${INPUT_UPDATE}" in
          true)
            ;;
          false)
            ;;
          *)
            printf "inputs.update must be 'true' or 'false'; got '%s'.\n" "$(printf '%s' "${INPUT_UPDATE}" | tr -d '\n\r')" >&2
            exit 1
            ;;
        esac

        if [ "${INPUT_UPDATE}" = true ] || [ -n "${INPUT_BOILERPLATES_REF}" ] || [ -d "${boilerplates_dir}" ]; then
          acquire_boilerplates_lock
        fi

        case "${INPUT_UPDATE}" in
          true)
            run_gibo_update
            ;;
          false)
            echo "Skipping 'gibo update' because inputs.update=false." >&2
            ;;
        esac

        boilerplates_commit=""
        if [ -n "${INPUT_BOILERPLATES_REF}" ]; then
          if [ ! -d "${boilerplates_dir}/.git" ]; then
            echo "install-gibo: inputs.boilerplates-ref was set, but '${boilerplates_dir}' is not a git repository." >&2
            echo "install-gibo: run with update='true' or restore the boilerplates database before pinning it." >&2
            exit 1
          fi

          modified_boilerplates_dir=true
          if printf '%s' "${INPUT_BOILERPLATES_REF}" | grep -qE '^[0-9a-f]{40}$'; then
            # Immutable SHA: resolve from the local database without a fetch.
            # The same SHA always points to the same object regardless of when
            # or where the action runs, so local resolution is correct.
            if ! boilerplates_commit=$(git -C "${boilerplates_dir}" rev-parse --verify "${INPUT_BOILERPLATES_REF}^{commit}" 2>/dev/null); then
              # Git servers reject fetches of unadvertised objects, so a bare
              # SHA cannot be fetched from remote when it is missing locally.
              echo "install-gibo: boilerplates-ref '${INPUT_BOILERPLATES_REF}' is a bare commit SHA that is not present in the local database." >&2
              echo "install-gibo: Git servers reject fetches of unadvertised objects, so bare SHAs cannot be fetched from remote." >&2
              echo "install-gibo: Use a tag name or branch name, or run with update='true' to populate the database first." >&2
              exit 1
            fi
          else
            # Mutable ref (branch or tag): always fetch from upstream so the
            # action resolves the current ref tip rather than a stale local
            # cache, making gibo dump output consistent across runs.
            git -C "${boilerplates_dir}" fetch --tags origin "${INPUT_BOILERPLATES_REF}"
            boilerplates_commit=$(git -C "${boilerplates_dir}" rev-parse --verify "FETCH_HEAD^{commit}")
          fi
          git -C "${boilerplates_dir}" checkout --detach "${boilerplates_commit}"
        fi

        if [ -d "${boilerplates_dir}/.git" ]; then
          boilerplates_commit=$(git -C "${boilerplates_dir}" rev-parse HEAD)
        fi
        cleanup_gibo_update_lock

        if [ "${INPUT_UPDATE}" = true ] && [ -z "${INPUT_BOILERPLATES_REF}" ] && [ -n "${boilerplates_commit}" ]; then
          echo "::notice::install-gibo: boilerplates-ref is not set; gibo dump output is non-deterministic and may change between runs. To make this run reproducible, set boilerplates-ref: ${boilerplates_commit}"
        fi

        install_succeeded=true
        {
          echo "version=${version}"
          echo "bin-dir=${bin_dir}"
          echo "boilerplates-dir=${boilerplates_dir}"
          echo "boilerplates-commit=${boilerplates_commit}"
        } >> "${GITHUB_OUTPUT}"
        echo "${bin_dir}" >> "${GITHUB_PATH}"
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_UPDATE: ${{ inputs.update }}
        INPUT_BOILERPLATES_REF: ${{ inputs.boilerplates-ref }}
