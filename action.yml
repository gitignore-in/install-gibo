name: Install gibo
author: Yui KITSU
description: Install gibo
branding:
  icon: folder-minus
  color: white

inputs:
  version:
    description: |
      gibo release tag to install. Leave empty to use the version pinned
      by the action. The pinned default and its checksum anchors are updated
      together by reviewed commits, not by version-only automation. Override
      to install a different release. Accepts stable semver (e.g. v3.0.22)
      and pre-release semver (e.g. v4.0.0-rc.1). Note: when overriding, the
      checksums anchor verification is skipped — the checksums file is trusted
      self-referentially (same release URL). See README.md (Security model)
      for the implications.
    required: false
    default: ''
  update:
    description: |
      Whether to run `gibo update` after installing the binary. Set to
      'false' when the caller restores the boilerplates database from
      `actions/cache` and wants to keep the cached database instead of
      unconditionally pulling upstream changes.
    required: false
    default: 'true'
  boilerplates-ref:
    description: |
      Optional git ref for the boilerplates database. When set, the
      action resolves the ref in the `gibo root` directory and checks
      it out before reporting outputs. With `update: 'true'`, the
      checkout happens after `gibo update`; with `update: 'false'`,
      it uses the database already present on the runner. This makes
      later `gibo dump` output reproducible for the selected database
      commit.
      A full 40-character commit SHA is resolved from the local
      database without a network fetch; the same SHA always points
      to the same object, so `gibo dump` output is stable across
      runs. For fully reproducible output, use a full commit SHA.
      A bare SHA only works when it is already present in the local
      boilerplates database; git servers reject fetches of
      unadvertised objects, so a bare SHA fails when the database is
      empty or was restored from cache without that commit. Use
      `update: 'true'` to populate the database first if needed.
      Branch and tag names (e.g. `main`, `v1.2.3`) are always fetched
      from upstream, so `gibo dump` output tracks the current ref tip
      and may change between runs as the ref advances.
    required: false
    default: ''

outputs:
  version:
    description: gibo release tag that was installed.
    value: ${{ steps.install.outputs.version }}
  bin-dir:
    description: |
      Directory containing the installed gibo executable. Already added
      to GITHUB_PATH; exposed so callers can reference it from
      `actions/cache` keys or other tooling.
    value: ${{ steps.install.outputs.bin-dir }}
  boilerplates-dir:
    description: |
      Directory where gibo stores its boilerplates database, as reported
      by `gibo root`. Set whenever gibo is present; empty when no
      database exists. Useful as the `path` of an `actions/cache` step.
    value: ${{ steps.install.outputs.boilerplates-dir }}
  boilerplates-commit:
    description: |
      Resolved commit of the boilerplates database when the database is
      present. Empty when the action did not create or restore the
      database.
    value: ${{ steps.install.outputs.boilerplates-commit }}
  update-performed:
    description: |
      'true' when `gibo update` was invoked in this action run,
      'false' otherwise (e.g. when `inputs.update` is 'false' or the
      database was restored from cache). Use this output to conditionally
      save an `actions/cache` entry only when the database changed.
    value: ${{ steps.install.outputs.update-performed }}
  boilerplates-created:
    description: |
      'true' when the boilerplates database directory did not exist
      before this run and was created by `gibo update`. 'false' when
      the directory already existed or `gibo update` was not invoked.
    value: ${{ steps.install.outputs.boilerplates-created }}

runs:
  using: composite
  steps:
    - id: install
      run: bash "${GITHUB_ACTION_PATH}/scripts/install.sh"
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_UPDATE: ${{ inputs.update }}
        INPUT_BOILERPLATES_REF: ${{ inputs.boilerplates-ref }}
