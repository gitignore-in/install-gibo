name: Update gitignore file

on:
  workflow_dispatch:
  schedule:
    # daily at 00:00
    - cron: '0 0 * * *'

permissions: {}

jobs:
  update-gitignore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: gitignore-in/gh-action@497638056b4abf3bc97f007e091b451633904f2f
