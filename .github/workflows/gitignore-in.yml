name: Update gitignore file

on:
  workflow_dispatch:
  schedule:
    # daily at 00:00
    - cron: '0 0 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-gitignore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: gitignore-in/gh-action@98ab8a7225c88b81167bfef156dbad83c554aaf4
